[package]
name = "najsu-photo-browser"
version = "0.1.0"
description = "Najsu Photo Browser"
authors = ["Michal Dovicovic"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "najsu_photo_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
rusqlite = { version = "0.32", features = ["bundled"] }
image = "0.25"
walkdir = "2"
sha2 = "0.10"
base64 = "0.22"
tauri-plugin-drag = "2.1.1"
rayon = "1"
ureq = { version = "2", default-features = false, features = ["json"] }


# Image analysis decodes full-size photos; unoptimized dev builds make that unusably slow.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
